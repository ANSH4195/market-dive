name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 11:30 UTC = 17:00 IST, after NSE/BSE close, Mon–Fri
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refresh market data; falls back to the committed snapshot if Yahoo is unreachable
      - run: pnpm run fetch-data

      - run: pnpm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
